<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2438;--mute:#667391;--line:#cfd6e4;--thick:#1b2438;--acc:#2456d6;--accbg:#dfe8ff;--peer:#eaf0fa;--same:#c9d8ff;--err:#d12a5a;--errbg:#ffe0e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e30;--ink:#e8edf8;--mute:#93a0bd;--line:#2b3550;--thick:#8fa0c8;--acc:#8ab0ff;--accbg:#23325c;--peer:#1d2640;--same:#2c3e72;--err:#ff7a9c;--errbg:#4a1d2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e30;--ink:#e8edf8;--mute:#93a0bd;--line:#2b3550;--thick:#8fa0c8;--acc:#8ab0ff;--accbg:#23325c;--peer:#1d2640;--same:#2c3e72;--err:#ff7a9c;--errbg:#4a1d2c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100dvh;padding:12px;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{width:100%;max-width:480px}
header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1{font-size:1.5rem;margin:0;flex:1;letter-spacing:-.02em}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-height:40px}
.pill.main{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
#info{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin:0 2px 8px}
#board{container-type:inline-size;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:min(100%,460px,max(260px,calc(100dvh - 330px)));aspect-ratio:1;margin:0 auto 12px;background:var(--card);border:2px solid var(--thick);border-radius:6px;overflow:hidden}
.c{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;font-size:calc(58cqw/var(--n));font-weight:500;color:var(--acc);min-width:0;min-height:0;overflow:hidden}
.c.g{color:var(--ink);font-weight:700}
.c.rb{border-right:2px solid var(--thick)}
.c.bb{border-bottom:2px solid var(--thick)}
.c.p{background:var(--peer)}
.c.s2{background:var(--same)}
.c.sel{background:var(--accbg);box-shadow:inset 0 0 0 2px var(--acc)}
.c.e{color:var(--err);background:var(--errbg)}
.nt{display:grid;width:100%;height:100%;padding:2px;font-size:calc(62cqw/var(--n)/var(--bw));font-weight:500;color:var(--mute);line-height:1;align-items:center;justify-items:center}
.nt i{font-style:normal}
#tools,#pad{display:grid;gap:6px;margin:0 auto 8px;width:min(100%,460px)}
#tools{grid-template-columns:repeat(4,1fr)}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;min-height:44px;font-size:.9rem}
.t.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
#pad{grid-template-columns:repeat(var(--n),1fr)}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0 4px;min-height:54px;font-size:1.4rem;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.k small{font-size:.65rem;font-weight:400;color:var(--mute)}
.k:disabled{opacity:.3}
#sheet{position:fixed;inset:0;background:rgba(10,14,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#sheet[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px}
.box h2{margin:0 0 4px}
.box p{color:var(--mute);margin:4px 0 12px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 0}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;min-height:46px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Sudoku</h1>
    <button class="pill" id="theme" aria-label="Byt tema"></button>
    <button class="pill main" id="newBtn">Nytt spel</button>
  </header>
  <div id="info"><span id="lvl"></span><span id="stat"></span></div>
  <div id="board" role="grid" aria-label="Sudokubräde"></div>
  <div id="tools">
    <button class="t" id="undo">Ångra</button>
    <button class="t" id="note">Anteckna</button>
    <button class="t" id="hint">Ledtråd</button>
    <button class="t" id="erase">Radera</button>
  </div>
  <div id="pad"></div>
</div>
<div id="sheet" hidden><div class="box" id="box"></div></div>

<script>
const $ = s => document.querySelector(s);
const DIM = {4:[2,2], 6:[2,3], 9:[3,3]};                 // [rutor per boxhöjd, rutor per boxbredd]
const REMOVE = {4:{l:6,m:8,s:10}, 6:{l:16,m:21,s:24}, 9:{l:38,m:47,s:54}}; // mål: antal tomma rutor
const NAME = {l:'Lätt', m:'Medel', s:'Svår'};
const store = {
  get(k,f){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = store.get('sudoku:game', null);
let cfg = store.get('sudoku:cfg', {n:9, d:'l'});
let G;

/* ---------- Logik ---------- */
function geo(n){
  const [bh,bw] = DIM[n], N = n*n, peers = [];
  const box = i => Math.floor(i/n/bh)*(n/bw) + Math.floor((i%n)/bw);
  for(let i=0;i<N;i++){
    const r = Math.floor(i/n), c = i%n, p = [];
    for(let j=0;j<N;j++) if(j!==i && (Math.floor(j/n)===r || j%n===c || box(j)===box(i))) p.push(j);
    peers.push(p);
  }
  return {bh, bw, peers};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cands(g,i,n,Gm){
  const u = new Set(Gm.peers[i].map(j => g[j])), c = [];
  for(let v=1; v<=n; v++) if(!u.has(v)) c.push(v);
  return c;
}
// Hitta tom ruta med färst kandidater (MRV)
function pick(g,n,Gm){
  let b=-1, bc=null;
  for(let i=0;i<g.length;i++) if(!g[i]){
    const c = cands(g,i,n,Gm);
    if(!bc || c.length<bc.length){ b=i; bc=c; if(!c.length) break; }
  }
  return {b, bc};
}
function fill(g,n,Gm){                                     // slumpad komplett lösning
  const {b,bc} = pick(g,n,Gm);
  if(b<0) return true;
  for(const v of shuffle(bc)){ g[b]=v; if(fill(g,n,Gm)) return true; }
  g[b]=0; return false;
}
function count(g,n,Gm,limit){                              // antal lösningar, max limit
  const {b,bc} = pick(g,n,Gm);
  if(b<0) return 1;
  let t=0;
  for(const v of bc){ g[b]=v; t += count(g,n,Gm,limit-t); if(t>=limit) break; }
  g[b]=0; return t;
}
function singles(p,n,Gm){                                  // kan lösas utan att gissa?
  const g = p.slice(); let ch = true;
  while(ch){
    ch = false;
    for(let i=0;i<g.length;i++) if(!g[i]){
      const c = cands(g,i,n,Gm);
      if(c.length===1){ g[i]=c[0]; ch=true; }
    }
  }
  return !g.includes(0);
}
function make(n,d){
  const Gm = geo(n), sol = Array(n*n).fill(0);
  fill(sol,n,Gm);
  const p = sol.slice(); let rem = 0;
  for(const i of shuffle([...p.keys()])){
    if(rem >= REMOVE[n][d]) break;
    const v = p[i]; p[i] = 0;
    // alltid exakt en lösning; på Lätt dessutom lösbar utan gissning
    if(count(p.slice(),n,Gm,2)===1 && (d!=='l' || singles(p,n,Gm))) rem++; else p[i] = v;
  }
  return {sol, p};
}

/* ---------- Spelstate ---------- */
function newGame(){
  const {n,d} = cfg, {sol,p} = make(n,d);
  S = {n, d, sol, p, cur:p.slice(), notes:Array(n*n).fill(0), hist:[], mist:0, hints:0, sel:-1, note:false, won:false};
  G = geo(n); save(); render();
}
function save(){ store.set('sudoku:game', S); store.set('sudoku:cfg', cfg); }
function snap(){ S.hist.push({c:S.cur.slice(), n:S.notes.slice()}); if(S.hist.length>200) S.hist.shift(); }
function place(i,v){
  S.cur[i] = v; S.notes[i] = 0;
  if(v) for(const j of G.peers[i]) S.notes[j] &= ~(1<<(v-1));
}
function checkWin(){
  if(S.won || !S.cur.every((v,i) => v===S.sol[i])) return;
  S.won = true;
  const st = store.get('sudoku:stats', {}), k = S.n+'-'+S.d, o = st[k] || {w:0, b:null};
  o.w++; if(o.b===null || S.mist<o.b) o.b = S.mist;
  st[k] = o; store.set('sudoku:stats', st);
  save(); render(); sheet(true);
}
function input(v){
  if(S.won || S.sel<0 || S.p[S.sel]) return;
  const i = S.sel;
  if(S.note){
    if(S.cur[i]) return;
    snap(); S.notes[i] ^= 1<<(v-1);
  } else {
    if(S.cur[i]===v) return;
    snap(); place(i,v);
    if(v!==S.sol[i]) S.mist++;
  }
  save(); render(); checkWin();
}
function erase(){
  if(S.won || S.sel<0 || S.p[S.sel]) return;
  snap();
  if(S.cur[S.sel]) S.cur[S.sel]=0; else S.notes[S.sel]=0;
  save(); render();
}
function undo(){
  const h = S.hist.pop(); if(!h || S.won) return;
  S.cur = h.c; S.notes = h.n; save(); render();
}
function hint(){
  if(S.won) return;
  let i = S.sel;
  if(i<0 || S.p[i] || S.cur[i]===S.sol[i]){
    const bad = [...S.cur.keys()].filter(j => S.cur[j]!==S.sol[j]);
    if(!bad.length) return;
    i = bad[Math.floor(Math.random()*bad.length)];
  }
  snap(); place(i,S.sol[i]); S.sel = i; S.hints++;
  save(); render(); checkWin();
}

/* ---------- Rendering ---------- */
function render(){
  const {n,cur,sel} = S, {bh,bw,peers} = G;
  const board = $('#board');
  board.style.setProperty('--n',n); board.style.setProperty('--bw',bw);
  $('#pad').style.setProperty('--n',n);
  const sv = sel>=0 ? cur[sel] : 0, ps = sel>=0 ? new Set(peers[sel]) : new Set();
  let h = '';
  for(let i=0;i<n*n;i++){
    const r = Math.floor(i/n), c = i%n, v = cur[i];
    const cl = ['c'];
    if(S.p[i]) cl.push('g');
    if((c+1)%bw===0 && c<n-1) cl.push('rb');
    if((r+1)%bh===0 && r<n-1) cl.push('bb');
    if(i===sel) cl.push('sel'); else if(sv && v===sv) cl.push('s2'); else if(ps.has(i)) cl.push('p');
    if(v && v!==S.sol[i]) cl.push('e');
    let inner = v || '';
    if(!v && S.notes[i]){
      inner = `<span class="nt" style="grid-template-columns:repeat(${bw},1fr)">` +
        Array.from({length:n},(_,k) => `<i>${S.notes[i]&(1<<k) ? k+1 : ''}</i>`).join('') + '</span>';
    }
    h += `<button class="${cl.join(' ')}" data-i="${i}" role="gridcell">${inner}</button>`;
  }
  board.innerHTML = h;
  let pad = '';
  for(let v=1; v<=n; v++){
    const left = n - cur.filter((x,i) => x===v && x===S.sol[i]).length;
    pad += `<button class="k" data-v="${v}" ${left<=0?'disabled':''}>${v}<small>${left>0?left:''}</small></button>`;
  }
  $('#pad').innerHTML = pad;
  $('#lvl').textContent = `${n}×${n}, ${NAME[S.d]}`;
  $('#stat').textContent = `Fel: ${S.mist}   Ledtrådar: ${S.hints}`;
  $('#note').classList.toggle('on', S.note);
  $('#undo').disabled = !S.hist.length;
}

function seg(key, vals, cur, label){
  return `<div class="seg">` + vals.map(v => `<button data-k="${key}" data-v="${v}" class="${v===cur?'on':''}">${label(v)}</button>`).join('') + `</div>`;
}
function sheet(win){
  const st = (store.get('sudoku:stats',{}))[cfg.n+'-'+cfg.d] || {w:0, b:null};
  let h = win
    ? `<h2>Klart!</h2><p>${S.n}×${S.n}, ${NAME[S.d].toLowerCase()}. Fel: ${S.mist}. Ledtrådar: ${S.hints}.</p>`
    : `<h2>Nytt spel</h2>`;
  h += seg('n',[4,6,9],cfg.n,v => `${v}×${v}`) + seg('d',['l','m','s'],cfg.d,v => NAME[v]);
  h += `<p>Lösta pussel här: ${st.w}.${st.b!==null ? ' Minst antal fel: '+st.b+'.' : ''}</p>`;
  h += `<div class="row">` + (S && !S.won && !win ? `<button class="pill" id="cancel">Avbryt</button>` : '') +
       `<button class="pill main" id="start">Starta</button></div>`;
  $('#box').innerHTML = h;
  $('#sheet').hidden = false;
}

/* ---------- Händelser ---------- */
$('#board').addEventListener('click', e => {
  const b = e.target.closest('.c'); if(!b) return;
  S.sel = +b.dataset.i; render();
});
$('#pad').addEventListener('click', e => { const b = e.target.closest('.k'); if(b) input(+b.dataset.v); });
$('#undo').onclick = undo;
$('#erase').onclick = erase;
$('#hint').onclick = hint;
$('#note').onclick = () => { S.note = !S.note; save(); render(); };
$('#newBtn').onclick = () => { cfg = {n:S.n, d:S.d}; sheet(false); };
$('#box').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.k){ cfg[b.dataset.k] = b.dataset.k==='n' ? +b.dataset.v : b.dataset.v; sheet(S.won && !$('#cancel')); return; }
  if(b.id==='start'){ $('#sheet').hidden = true; newGame(); }
  if(b.id==='cancel') $('#sheet').hidden = true;
});
document.addEventListener('keydown', e => {
  if(!S || !$('#sheet').hidden) return;
  if(e.key>='1' && e.key<='9' && +e.key<=S.n) input(+e.key);
  else if(e.key==='Backspace' || e.key==='Delete') erase();
});

/* ---------- Tema ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t==='dark' ? 'Ljust' : 'Mörkt';
}
let theme = store.get('sudoku:theme', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(theme);
$('#theme').onclick = () => { theme = theme==='dark' ? 'light' : 'dark'; store.set('sudoku:theme', theme); setTheme(theme); };

/* ---------- Start ---------- */
if(S && S.sol && S.sol.length===S.n*S.n){ G = geo(S.n); render(); if(S.won) sheet(true); }
else newGame();
</script>
</body>
</html>
